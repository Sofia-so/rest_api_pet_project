name: Run Tests

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: test_db_rest_api_proj
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          CONFIG_TYPE: app.config.TestingConfig
          TEST_DATABASE_URI: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/test_db_rest_api_proj
          JWT_SECRET_KEY: test-jwt-secret-key
          TEST_SECRET_KEY: test_secret_key
        run: python -m pytest tests
